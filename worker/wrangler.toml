name = "balcones-tablero"
main = "src/index.js"
compatibility_date = "2026-08-31"

[vars]
# Proyecto de Google Cloud `balcones-507302` (número 891645522580) — el mismo
# donde vive la cuenta de servicio. El prefijo numérico del ID de cliente ES el
# número de proyecto: si no coincide con el de la cuenta de servicio, están en
# proyectos distintos y algo va a fallar.
#
# Si esto queda vacío, el Worker responde 500 de configuración a todo el mundo,
# a propósito: con el identificador vacío Google apaga la verificación de
# destinatario y entraría cualquiera. Ver worker/src/auth.js.
GOOGLE_CLIENT_ID = "891645522580-n28qonptovkp695lg3pu0p7nchgt5nfd.apps.googleusercontent.com"
# El libro de control financiero. Las cuatro pestañas «Tablero …» viven adentro,
# con fórmulas locales: no hay IMPORTRANGE y por lo tanto no hay autorización
# manual que se caiga. Ver el comentario de PESTANAS en src/sheets.js.
ID_HOJA_ESPEJO = "1Ox0ndTMSilrXw4MT2OoW3xcT9hhyuqQn_-yyp6h2jmY"

# El sitio en GitHub Pages. Es el único origen al que el Worker le responde.
ORIGEN_PERMITIDO = "https://lfelipezapata-gif.github.io"

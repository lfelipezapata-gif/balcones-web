<!DOCTYPE html>
<html lang="es-CO">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Balcones — Tablero de socios</title>
<link rel="stylesheet" href="../assets/css/estilos.css">
<link rel="icon" href="../img/favicon-32.png" sizes="32x32">
<script src="https://accounts.google.com/gsi/client" async></script>
</head>
<body class="tablero">

<header class="barra">
  <div class="barra-dentro">
    <div>
      <h1>Condominio Balcones</h1>
      <p class="sub">Tablero de socios</p>
    </div>
    <p id="frescura" class="frescura"></p>
  </div>
</header>

<section id="entrada">
  <p>Entrá con la cuenta de Google con la que te compartieron el tablero.</p>
  <div id="boton-google"></div>
  <p id="error" class="error" hidden></p>
</section>

<main id="contenido" hidden>
  <p id="alerta" class="alerta" hidden></p>

  <div id="resumen" class="cifras"></div>

  <nav class="pestanas" role="tablist" aria-label="Secciones del tablero">
    <button type="button" class="pestana" id="tab-lotes" role="tab"
            aria-selected="true" aria-controls="panel-lotes">Los lotes</button>
    <button type="button" class="pestana" id="tab-gastos" role="tab"
            aria-selected="false" aria-controls="panel-gastos">En qué se ha gastado</button>
    <button type="button" class="pestana" id="tab-socios" role="tab"
            aria-selected="false" aria-controls="panel-socios">Los socios</button>
  </nav>

  <section id="panel-lotes" role="tabpanel" aria-labelledby="tab-lotes">
    <div class="columnas">
      <div class="plano">
        <div id="mapa" class="mapa-caja"></div>
        <p class="leyenda">
          <span><span class="muestra" data-estado="disponible"></span>Disponible</span>
          <span><span class="muestra" data-estado="vendido"></span>Vendido</span>
          <span><span class="muestra" data-estado="seleccionado"></span>Seleccionado</span>
        </p>
      </div>
      <div id="ficha" class="ficha"></div>
    </div>
  </section>

  <section id="panel-gastos" role="tabpanel" aria-labelledby="tab-gastos" hidden>
    <div id="gastos"></div>
    <div id="movimientos" class="movimientos"></div>
  </section>

  <section id="panel-socios" role="tabpanel" aria-labelledby="tab-socios" hidden>
    <div id="socios"></div>
  </section>

  <section id="avisos" class="avisos"></section>
</main>

<script type="module">
import { GOOGLE_CLIENT_ID, API_TABLERO } from '../assets/js/config.js';
import { construirVistaTablero, escapar } from '../assets/js/tablero.js';
import {
  construirCifras, construirVistaLotes, construirVistaGastos, construirVistaSocios
} from '../assets/js/paneles.js';
import { pintarMapa } from '../assets/js/mapa.js';

const $ = (id) => document.getElementById(id);

// TODO el texto que sale de la hoja de Google llega acá ya escapado: lo escapa
// `construirVistaTablero` en el borde y los paneles no lo vuelven a tocar (ver
// assets/js/paneles.js). Lo único que este archivo interpola sin pasar por ahí
// son números que él mismo valida —el porcentaje de la barra, el índice de una
// categoría, el estado del lote validado por `validarInventario`—. Si mañana
// alguien mete acá un campo nuevo del Worker sin pasarlo por la vista, vuelve
// el XSS del comprador `<img src=x onerror=...>`.

function mostrarError(mensaje) {
  $('error').textContent = mensaje;
  $('error').hidden = false;
  $('entrada').hidden = false;
  $('contenido').hidden = true;
}

/* --- pestañas ---------------------------------------------------------- */

const PESTANAS = [
  ['tab-lotes', 'panel-lotes'],
  ['tab-gastos', 'panel-gastos'],
  ['tab-socios', 'panel-socios']
];

function verPestana(tabActiva) {
  for (const [tab, panel] of PESTANAS) {
    const activa = tab === tabActiva;
    $(tab).setAttribute('aria-selected', activa ? 'true' : 'false');
    $(panel).hidden = !activa;
  }
}
for (const [tab] of PESTANAS) {
  $(tab).addEventListener('click', () => verPestana(tab));
}

/* --- el plano y la ficha ----------------------------------------------- */

function pintarFicha(f) {
  if (!f) { $('ficha').innerHTML = ''; return; }
  const filas = f.filas.map(x =>
    `<div class="dato"><dt>${x.etiqueta}</dt><dd>${x.valor}</dd></div>`).join('');
  // `porcentaje` es un entero de 0 a 100 que calculó `porcentajePagado`, no un
  // dato de la hoja: por eso puede ir dentro de un `style`.
  const progreso = f.progreso
    ? `<div class="progreso">
         <div class="barra-progreso"><span style="width:${f.progreso.porcentaje}%"></span></div>
         <p class="progreso-texto">${f.progreso.texto}</p>
       </div>`
    : '';
  const calendario = f.calendario
    ? `<p class="calendario${f.calendario.vencido ? ' vencido' : ''}">
         <span class="rot">Próxima cuota</span>${f.calendario.texto}</p>`
    : '';
  const nota = f.nota ? `<p class="ficha-nota">${f.nota}</p>` : '';

  $('ficha').innerHTML = `
    <p class="ficha-cabeza">
      <span class="ficha-numero">${f.numeroTexto}</span>
      <span class="pildora" data-estado="${f.estado}">${f.etiqueta}</span>
    </p>
    <dl class="ficha-datos">${filas}</dl>
    ${progreso}${calendario}${nota}`;
}

// Monta el plano, lo deja clicable y devuelve los avisos de lo que no cuadra
// entre el plano y la cartera. Va aparte del resto a propósito: si el plano
// revienta, las cifras, los gastos y los avisos no tienen por qué caerse con él.
async function montarPlano(vista) {
  const inv = await (await fetch('../data/lotes.json')).json();

  // El plano se inserta en el documento (no como <img>) porque el color de
  // cada lote lo pone el CSS sobre los <path>, y a un <img> no se le puede
  // entrar desde afuera.
  const caja = $('mapa');
  caja.innerHTML = await (await fetch('../img/mapa.svg')).text();
  const svg = caja.querySelector('svg');
  pintarMapa(svg, inv);

  const { fichas, inicial, avisos } = construirVistaLotes(vista, inv);
  const porLote = new Map(fichas.map(f => [f.n, f]));

  const poligonos = [...svg.querySelectorAll('.lote[data-lote]')];
  for (const p of poligonos) {
    p.setAttribute('tabindex', '0');
    p.setAttribute('role', 'button');
  }

  function seleccionar(n) {
    const f = porLote.get(n);
    if (!f) return;
    for (const p of poligonos) {
      const activo = p.dataset.lote === String(n);
      p.toggleAttribute('data-seleccionado', activo);
      p.setAttribute('aria-pressed', activo ? 'true' : 'false');
      const rotulo = svg.querySelector(`.rotulo-lote[data-lote="${p.dataset.lote}"]`);
      if (rotulo) rotulo.toggleAttribute('data-seleccionado', activo);
    }
    pintarFicha(f);
  }

  svg.addEventListener('click', (e) => {
    const p = e.target.closest?.('.lote[data-lote]');
    if (p) seleccionar(Number(p.dataset.lote));
  });
  svg.addEventListener('keydown', (e) => {
    if (e.key !== 'Enter' && e.key !== ' ') return;
    const p = e.target.closest?.('.lote[data-lote]');
    if (!p) return;
    e.preventDefault();
    seleccionar(Number(p.dataset.lote));
  });

  if (inicial !== null) seleccionar(inicial);
  return avisos;
}

/* --- gastos ------------------------------------------------------------ */

function pintarGastos(vista) {
  const g = construirVistaGastos(vista.egresosPorCategoria);

  if (g.categorias.length === 0) {
    $('gastos').innerHTML =
      '<p class="invitacion">Todavía no hay movimientos de obra que mostrar. Mirá los avisos del final.</p>';
    $('movimientos').innerHTML = '';
    return;
  }

  const filas = g.categorias.map(c => `
    <li>
      <button type="button" class="categoria" data-indice="${c.indice}" aria-expanded="false">
        <span class="cat-nombre">${c.categoria}</span>
        <span class="cat-total${c.incompleto ? ' incompleto' : ''}">${c.totalTexto}</span>
        <span class="cat-barra"><span style="width:${c.proporcion}%"></span></span>
      </button>
    </li>`).join('');

  $('gastos').innerHTML = `
    <p class="gastos-total">Total de obra
      <strong class="${g.incompleto ? 'incompleto' : ''}">${g.totalTexto}</strong></p>
    <ul class="categorias">${filas}</ul>`;

  $('movimientos').innerHTML =
    '<p class="invitacion">Tocá una categoría para ver en qué se fue.</p>';

  const botones = [...$('gastos').querySelectorAll('.categoria')];
  for (const b of botones) {
    b.addEventListener('click', () => {
      const c = g.categorias[Number(b.dataset.indice)];
      const abierta = b.getAttribute('aria-expanded') === 'true';
      for (const otro of botones) otro.setAttribute('aria-expanded', 'false');

      if (abierta) {
        $('movimientos').innerHTML =
          '<p class="invitacion">Tocá una categoría para ver en qué se fue.</p>';
        return;
      }
      b.setAttribute('aria-expanded', 'true');
      $('movimientos').innerHTML = `
        <h3>${c.categoria}</h3>
        ${c.movimientos.map(m => `
          <p class="mov">
            <span class="fecha">${m.fecha}</span>
            <span class="concepto">${m.concepto}</span>
            <span class="valor">${m.valorTexto}</span>
          </p>`).join('')}`;
    });
  }
}

/* --- los socios -------------------------------------------------------- */

// La tabla de lo que puso cada socio por la tierra.
//
// Todo el texto que sale de la hoja —el nombre del socio y el rótulo de cada
// ronda de aportes— llega ya escapado desde `construirVistaTablero`. Lo único
// que se interpola sin venir de ahí es `diferenciaEstado`, que sale de un
// vocabulario cerrado de assets/js/paneles.js ('exacto', 'de-mas', 'de-menos',
// 'sin-dato') y por eso puede ir dentro de un atributo.
//
// `data-col` repite el nombre de la columna en cada celda. No es decorativo: en
// pantalla angosta la tabla se apila y el CSS saca de ahí el rótulo de cada
// dato. Sin él, en el teléfono queda una lista de cifras sin nombre.
function pintarSocios(vista) {
  const s = construirVistaSocios(vista.socios);

  if (s.socios.length === 0) {
    $('socios').innerHTML =
      '<p class="invitacion">Todavía no hay aportes de socios que mostrar. Mirá los avisos del final.</p>';
    return;
  }

  const cols = s.etiquetasPagos;
  const celdasPago = (pagos) => pagos.map((p, i) =>
    `<td class="num" data-col="${cols[i] ?? ''}">${p.valorTexto}</td>`).join('');

  const filas = s.socios.map(x => `
    <tr>
      <th scope="row" class="socio-nombre">${x.nombre || '—'}</th>
      <td class="num" data-col="Participación">${x.participacionTexto}</td>
      ${celdasPago(x.pagos)}
      <td class="num aporte-total" data-col="Total aportado">${x.totalTexto}</td>
      <td class="num diferencia" data-col="Diferencia" data-dif="${x.diferenciaEstado}">
        ${x.diferenciaTexto}</td>
    </tr>`).join('');

  const pie = `
    <tr>
      <th scope="row" class="socio-nombre">Total</th>
      <td class="num${s.participacionCuadra ? '' : ' incompleto'}"
          data-col="Participación">${s.participacionTotalTexto}</td>
      ${s.totalesPagos.map((t, i) =>
        `<td class="num${t.incompleto ? ' incompleto' : ''}" data-col="${cols[i] ?? ''}">${t.texto}</td>`).join('')}
      <td class="num aporte-total${s.incompleto ? ' incompleto' : ''}"
          data-col="Total aportado">${s.totalTexto}</td>
      <td class="num diferencia" data-col="Diferencia"
          data-dif="${s.diferenciaTotalEstado}">${s.diferenciaTotalTexto}</td>
    </tr>`;

  const avisoReparto = s.participacionCuadra ? '' :
    `<p class="socios-nota alerta-reparto">Las participaciones no suman 100 %
      (suman ${s.participacionTotalTexto}). Mientras no cuadren, lo que le
      corresponde a cada uno está mal repartido en la hoja.</p>`;

  $('socios').innerHTML = `
    <p class="socios-intro">Lo que puso cada socio por la tierra. La última columna
      es la diferencia entre lo que aportó y lo que le corresponde por su
      participación: en verde puso de más, en rojo puso de menos, y en gris está exacto.</p>
    <div class="tabla-envoltura">
      <table class="tabla-socios">
        <thead>
          <tr>
            <th scope="col">Socio</th>
            <th scope="col">Participación</th>
            ${cols.map(c => `<th scope="col">${c}</th>`).join('')}
            <th scope="col">Total aportado</th>
            <th scope="col">Diferencia</th>
          </tr>
        </thead>
        <tbody>${filas}</tbody>
        <tfoot>${pie}</tfoot>
      </table>
    </div>
    ${avisoReparto}`;
}

/* --- carga ------------------------------------------------------------- */

async function cargar(credencial) {
  let r;
  try {
    r = await fetch(API_TABLERO, { headers: { authorization: `Bearer ${credencial}` } });
  } catch {
    return mostrarError('No hay conexión con el servidor del tablero.');
  }
  let cuerpo;
  try {
    cuerpo = await r.json();
  } catch {
    // Cloudflare (u otra capa de borde) puede devolver una página de error
    // que no es JSON en cortes de infraestructura (502/522/523, un WAF).
    // Sin este try/catch esa excepción quedaba como unhandled rejection y
    // la pantalla de entrada se quedaba muda, sin ningún mensaje.
    return mostrarError('El servidor del tablero respondió con algo que no se pudo leer. Volvé a intentar en un momento.');
  }
  if (!r.ok) return mostrarError(cuerpo.error ?? 'No se pudo cargar el tablero.');

  const v = construirVistaTablero(cuerpo, new Date());
  $('entrada').hidden = true;
  $('contenido').hidden = false;
  $('frescura').textContent = v.frescura;

  if (v.alerta) { $('alerta').textContent = v.alerta; $('alerta').hidden = false; }

  $('resumen').innerHTML = construirCifras(v.resumen).map(c => `
    <div class="cifra-caja">
      <span class="rot">${c.etiqueta}</span><span class="val">${c.texto}</span>
    </div>`).join('');

  // `pintarMapa` revienta a propósito si el plano y data/lotes.json dejan de
  // hablar del mismo conjunto de lotes. Sin este try/catch esa excepción se
  // llevaba por delante los gastos y los avisos, que no tienen nada que ver.
  let avisosDelPlano = [];
  try {
    avisosDelPlano = await montarPlano(v);
  } catch (e) {
    $('mapa').innerHTML = '';
    $('ficha').innerHTML =
      '<p class="plano-error">No se pudo dibujar el plano de lotes. Las cifras y los gastos de abajo sí están al día.</p>';
    avisosDelPlano = [`No se pudo dibujar el plano de lotes: ${String(e.message ?? e)}`];
  }

  pintarGastos(v);
  pintarSocios(v);

  // Los avisos del plano se muestran junto con los del Worker, en la misma
  // lista: los dos dicen «esto que ves puede estar mal, andá a revisar la
  // fuente». Los del Worker ya salieron escapados de `construirVistaTablero`;
  // los del plano los arma este archivo y por eso se escapan acá, sin
  // excepción, aunque hoy solo lleven números.
  const avisos = [...v.avisos, ...avisosDelPlano.map(escapar)];
  $('avisos').innerHTML = avisos.length
    ? '<h2>Revisar</h2><ul>' + avisos.map(a => `<li>${a}</li>`).join('') + '</ul>'
    : '';
}

window.onload = () => {
  // Si el script de accounts.google.com no cargó (sin conexión al momento
  // de abrir la página, red bloqueada, origen no autorizado), "google" no
  // existe: sin este chequeo era un ReferenceError silencioso y el botón
  // de entrar no aparecía nunca, sin ninguna explicación en pantalla.
  if (typeof google === 'undefined' || !google.accounts?.id) {
    return mostrarError('No se pudo cargar el inicio de sesión de Google. Revisá tu conexión a internet y recargá la página.');
  }
  google.accounts.id.initialize({
    client_id: GOOGLE_CLIENT_ID,
    callback: (r) => cargar(r.credential)
  });
  google.accounts.id.renderButton($('boton-google'), { theme: 'outline', size: 'large', locale: 'es' });
};
</script>

</body>
</html>

<!DOCTYPE html>
<html lang="es-CO">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Balcones — Tablero de socios</title>
<link rel="stylesheet" href="../assets/css/estilos.css?v=85238aa1">
<link rel="icon" href="../img/favicon-32.png" sizes="32x32">
<script src="https://accounts.google.com/gsi/client" async></script>
</head>
<body class="tablero">

<header class="barra">
  <div class="barra-dentro">
    <div>
      <h1>Condominio Balcones</h1>
      <p class="sub">Tablero de socios</p>
    </div>
    <p id="frescura" class="frescura"></p>
  </div>
</header>

<section id="entrada">
  <p>Entrá con la cuenta de Google con la que te compartieron el tablero.</p>
  <div id="boton-google"></div>
  <p id="error" class="error" hidden></p>
</section>

<main id="contenido" hidden>
  <p id="alerta" class="alerta" hidden></p>

  <div id="resumen" class="cifras"></div>
  <!-- El listado que explica la cifra que se pulsó arriba. Vive aquí, pegado a
       las tarjetas, y no dentro de una pestaña: la pregunta «¿de dónde sale
       este número?» se contesta al lado del número. -->
  <div id="detalle-cifra" hidden></div>

  <nav class="pestanas" role="tablist" aria-label="Secciones del tablero">
    <button type="button" class="pestana" id="tab-lotes" role="tab"
            aria-selected="true" aria-controls="panel-lotes">Los lotes</button>
    <button type="button" class="pestana" id="tab-gastos" role="tab"
            aria-selected="false" aria-controls="panel-gastos">En qué se ha gastado</button>
    <button type="button" class="pestana" id="tab-socios" role="tab"
            aria-selected="false" aria-controls="panel-socios">Los socios</button>
    <button type="button" class="pestana" id="tab-caja" role="tab"
            aria-selected="false" aria-controls="panel-caja">La caja</button>
  </nav>

  <section id="panel-lotes" role="tabpanel" aria-labelledby="tab-lotes">
    <!-- Los tres botones y el resumen del grupo elegido los llena
         `montarPlano` desde `construirTotalesLotes`, para que el rótulo y la
         clave de cada grupo vivan en un solo lado. -->
    <div id="filtros" class="filtros" role="group" aria-label="Qué lotes ver"></div>
    <div id="totales" class="totales" hidden></div>
    <div class="columnas">
      <div class="plano">
        <div id="mapa" class="mapa-caja"></div>
        <p class="leyenda">
          <span><span class="muestra" data-estado="disponible"></span>Disponible</span>
          <span><span class="muestra" data-estado="vendido"></span>Vendido</span>
          <span><span class="muestra" data-estado="seleccionado"></span>Seleccionado</span>
        </p>
      </div>
      <div id="ficha" class="ficha"></div>
    </div>
  </section>

  <section id="panel-gastos" role="tabpanel" aria-labelledby="tab-gastos" hidden>
    <div id="gastos"></div>
    <div id="movimientos" class="movimientos"></div>
  </section>

  <section id="panel-socios" role="tabpanel" aria-labelledby="tab-socios" hidden>
    <div id="socios"></div>
  </section>

  <section id="panel-caja" role="tabpanel" aria-labelledby="tab-caja" hidden>
    <div id="caja"></div>
  </section>

  <section id="avisos" class="avisos"></section>
</main>

<script type="module">
import { GOOGLE_CLIENT_ID, API_TABLERO } from '../assets/js/config.js?v=85238aa1';
import { construirVistaTablero, escapar } from '../assets/js/tablero.js?v=85238aa1';
import {
  construirCifras, construirVistaLotes, construirVistaGastos, construirVistaSocios,
  construirTotalesLotes, construirVistaCaja, construirDetalleCifra
} from '../assets/js/paneles.js?v=85238aa1';
import { pintarMapa } from '../assets/js/mapa.js?v=85238aa1';

const $ = (id) => document.getElementById(id);

// TODO el texto que sale de la hoja de Google llega acá ya escapado: lo escapa
// `construirVistaTablero` en el borde y los paneles no lo vuelven a tocar (ver
// assets/js/paneles.js). Lo único que este archivo interpola sin pasar por ahí
// son números que él mismo valida —el porcentaje de la barra, el índice de una
// categoría, el estado del lote validado por `validarInventario`—. Si mañana
// alguien mete acá un campo nuevo del Worker sin pasarlo por la vista, vuelve
// el XSS del comprador `<img src=x onerror=...>`.

function mostrarError(mensaje) {
  $('error').textContent = mensaje;
  $('error').hidden = false;
  $('entrada').hidden = false;
  $('contenido').hidden = true;
}

/* --- pestañas ---------------------------------------------------------- */

const PESTANAS = [
  ['tab-lotes', 'panel-lotes'],
  ['tab-gastos', 'panel-gastos'],
  ['tab-socios', 'panel-socios'],
  ['tab-caja', 'panel-caja']
];

function verPestana(tabActiva) {
  for (const [tab, panel] of PESTANAS) {
    const activa = tab === tabActiva;
    $(tab).setAttribute('aria-selected', activa ? 'true' : 'false');
    $(panel).hidden = !activa;
  }
}
for (const [tab] of PESTANAS) {
  $(tab).addEventListener('click', () => verPestana(tab));
}

/* --- el plano y la ficha ----------------------------------------------- */

function pintarFicha(f) {
  if (!f) { $('ficha').innerHTML = ''; return; }
  const filas = f.filas.map(x =>
    `<div class="dato"><dt>${x.etiqueta}</dt><dd>${x.valor}</dd></div>`).join('');
  // `porcentaje` es un entero de 0 a 100 que calculó `porcentajePagado`, no un
  // dato de la hoja: por eso puede ir dentro de un `style`.
  const progreso = f.progreso
    ? `<div class="progreso">
         <div class="barra-progreso"><span style="width:${f.progreso.porcentaje}%"></span></div>
         <p class="progreso-texto">${f.progreso.texto}</p>
       </div>`
    : '';
  const calendario = f.calendario
    ? `<p class="calendario${f.calendario.vencido ? ' vencido' : ''}">
         <span class="rot">Próxima cuota</span>${f.calendario.texto}</p>`
    : '';
  const nota = f.nota ? `<p class="ficha-nota">${f.nota}</p>` : '';

  $('ficha').innerHTML = `
    <p class="ficha-cabeza">
      <span class="ficha-numero">${f.numeroTexto}</span>
      <span class="pildora" data-estado="${f.estado}">${f.etiqueta}</span>
    </p>
    <dl class="ficha-datos">${filas}</dl>
    ${progreso}${calendario}${nota}`;
}

// Monta el plano, lo deja clicable y devuelve los avisos de lo que no cuadra
// entre el plano y la cartera. Va aparte del resto a propósito: si el plano
// revienta, las cifras, los gastos y los avisos no tienen por qué caerse con él.
async function montarPlano(vista) {
  const inv = await (await fetch('../data/lotes.json?v=85238aa1')).json();

  // El plano se inserta en el documento (no como <img>) porque el color de
  // cada lote lo pone el CSS sobre los <path>, y a un <img> no se le puede
  // entrar desde afuera.
  const caja = $('mapa');
  caja.innerHTML = await (await fetch('../img/mapa.svg')).text();
  const svg = caja.querySelector('svg');
  pintarMapa(svg, inv);

  const { fichas, inicial, avisos } = construirVistaLotes(vista, inv);
  const porLote = new Map(fichas.map(f => [f.n, f]));

  const poligonos = [...svg.querySelectorAll('.lote[data-lote]')];
  for (const p of poligonos) {
    p.setAttribute('tabindex', '0');
    p.setAttribute('role', 'button');
  }

  function seleccionar(n) {
    const f = porLote.get(n);
    if (!f) return;
    for (const p of poligonos) {
      const activo = p.dataset.lote === String(n);
      p.toggleAttribute('data-seleccionado', activo);
      p.setAttribute('aria-pressed', activo ? 'true' : 'false');
      const rotulo = svg.querySelector(`.rotulo-lote[data-lote="${p.dataset.lote}"]`);
      if (rotulo) rotulo.toggleAttribute('data-seleccionado', activo);
    }
    pintarFicha(f);
  }

  svg.addEventListener('click', (e) => {
    const p = e.target.closest?.('.lote[data-lote]');
    if (p) seleccionar(Number(p.dataset.lote));
  });
  svg.addEventListener('keydown', (e) => {
    if (e.key !== 'Enter' && e.key !== ' ') return;
    const p = e.target.closest?.('.lote[data-lote]');
    if (!p) return;
    e.preventDefault();
    seleccionar(Number(p.dataset.lote));
  });

  if (inicial !== null) seleccionar(inicial);

  /* --- el filtro de arriba del plano ------------------------------------ */
  //
  // Tres botones: todos, vendidos y sin vender. Al elegir uno, los lotes que
  // no entran se APAGAN, no se esconden — esto es un plano, y un plano al que
  // le faltan lotes ya no es el mismo terreno. Siguen clicables y su ficha
  // sigue abriéndose igual, así que el filtro nunca deja un lote fuera de
  // alcance.
  //
  // Todo lo que se pinta acá sale de `construirTotalesLotes`: etiquetas que son
  // literales de assets/js/paneles.js y cifras formateadas a partir de números.
  // Nada de esto viene de la hoja de Google. Se escapa igual, sin excepción.
  const grupos = construirTotalesLotes(vista, inv);

  function pintarTotales(g) {
    if (!g.muestraResumen) {
      $('totales').innerHTML = '';
      $('totales').hidden = true;
      return;
    }
    const cifras = g.cifras.map(c => `
      <div class="cifra-caja">
        <span class="rot">${escapar(c.etiqueta)}</span>
        <span class="val${c.incompleto ? ' incompleto' : ''}">${escapar(c.texto)}</span>
      </div>`).join('');
    $('totales').hidden = false;
    $('totales').innerHTML =
      (cifras ? `<div class="totales-cifras">${cifras}</div>` : '') +
      (g.nota ? `<p class="totales-nota">${escapar(g.nota)}</p>` : '');
  }

  function verGrupo(clave) {
    const g = grupos.find(x => x.clave === clave) ?? grupos[0];
    const enElGrupo = new Set(g.lotes.map(String));
    const apagaAlgo = g.clave !== 'todos';

    for (const b of $('filtros').querySelectorAll('.filtro')) {
      b.setAttribute('aria-pressed', b.dataset.grupo === g.clave ? 'true' : 'false');
    }
    for (const p of poligonos) {
      const fuera = apagaAlgo && !enElGrupo.has(p.dataset.lote);
      p.toggleAttribute('data-atenuado', fuera);
      const rotulo = svg.querySelector(`.rotulo-lote[data-lote="${p.dataset.lote}"]`);
      if (rotulo) rotulo.toggleAttribute('data-atenuado', fuera);
    }
    pintarTotales(g);
  }

  // `g.clave` sale del vocabulario cerrado de paneles.js ('todos', 'vendidos',
  // 'sinVender') y por eso puede ir dentro de un atributo.
  $('filtros').innerHTML = grupos.map(g => `
    <button type="button" class="filtro" data-grupo="${g.clave}"
            aria-pressed="false">${escapar(g.etiqueta)}</button>`).join('');
  for (const b of $('filtros').querySelectorAll('.filtro')) {
    b.addEventListener('click', () => verGrupo(b.dataset.grupo));
  }
  verGrupo('todos');

  return avisos;
}

/* --- gastos ------------------------------------------------------------ */

function pintarGastos(vista) {
  const g = construirVistaGastos(vista.egresosPorCategoria);

  if (g.categorias.length === 0) {
    $('gastos').innerHTML =
      '<p class="invitacion">Todavía no hay movimientos de obra que mostrar. Mirá los avisos del final.</p>';
    $('movimientos').innerHTML = '';
    return;
  }

  const filas = g.categorias.map(c => `
    <li>
      <button type="button" class="categoria" data-indice="${c.indice}" aria-expanded="false">
        <span class="cat-nombre">${c.categoria}</span>
        <span class="cat-total${c.incompleto ? ' incompleto' : ''}">${c.totalTexto}</span>
        <span class="cat-barra"><span style="width:${c.proporcion}%"></span></span>
      </button>
    </li>`).join('');

  $('gastos').innerHTML = `
    <p class="gastos-total">Total de obra
      <strong class="${g.incompleto ? 'incompleto' : ''}">${g.totalTexto}</strong></p>
    <ul class="categorias">${filas}</ul>`;

  $('movimientos').innerHTML =
    '<p class="invitacion">Tocá una categoría para ver en qué se fue.</p>';

  const botones = [...$('gastos').querySelectorAll('.categoria')];
  for (const b of botones) {
    b.addEventListener('click', () => {
      const c = g.categorias[Number(b.dataset.indice)];
      const abierta = b.getAttribute('aria-expanded') === 'true';
      for (const otro of botones) otro.setAttribute('aria-expanded', 'false');

      if (abierta) {
        $('movimientos').innerHTML =
          '<p class="invitacion">Tocá una categoría para ver en qué se fue.</p>';
        return;
      }
      b.setAttribute('aria-expanded', 'true');
      $('movimientos').innerHTML = `
        <h3>${c.categoria}</h3>
        ${c.movimientos.map(m => `
          <p class="mov">
            <span class="fecha">${m.fecha}</span>
            <span class="concepto">${m.concepto}</span>
            <span class="valor">${m.valorTexto}</span>
          </p>`).join('')}`;
    });
  }
}

/* --- los socios -------------------------------------------------------- */

// La tabla de lo que puso cada socio por la tierra.
//
// Todo el texto que sale de la hoja —el nombre del socio y el rótulo de cada
// ronda de aportes— llega ya escapado desde `construirVistaTablero`. Lo único
// que se interpola sin venir de ahí es `diferenciaEstado`, que sale de un
// vocabulario cerrado de assets/js/paneles.js ('exacto', 'de-mas', 'de-menos',
// 'sin-dato') y por eso puede ir dentro de un atributo.
//
// `data-col` repite el nombre de la columna en cada celda. No es decorativo: en
// pantalla angosta la tabla se apila y el CSS saca de ahí el rótulo de cada
// dato. Sin él, en el teléfono queda una lista de cifras sin nombre.
function pintarSocios(vista) {
  const s = construirVistaSocios(vista.socios);

  if (s.socios.length === 0) {
    $('socios').innerHTML =
      '<p class="invitacion">Todavía no hay aportes de socios que mostrar. Mirá los avisos del final.</p>';
    return;
  }

  const cols = s.etiquetasPagos;
  const celdasPago = (pagos) => pagos.map((p, i) =>
    `<td class="num" data-col="${cols[i] ?? ''}">${p.valorTexto}</td>`).join('');

  const filas = s.socios.map(x => `
    <tr>
      <th scope="row" class="socio-nombre">${x.nombre || '—'}</th>
      <td class="num" data-col="Participación">${x.participacionTexto}</td>
      ${celdasPago(x.pagos)}
      <td class="num aporte-total" data-col="Total aportado">${x.totalTexto}</td>
      <td class="num diferencia" data-col="Diferencia" data-dif="${x.diferenciaEstado}">
        ${x.diferenciaTexto}</td>
    </tr>`).join('');

  const pie = `
    <tr>
      <th scope="row" class="socio-nombre">Total</th>
      <td class="num${s.participacionCuadra ? '' : ' incompleto'}"
          data-col="Participación">${s.participacionTotalTexto}</td>
      ${s.totalesPagos.map((t, i) =>
        `<td class="num${t.incompleto ? ' incompleto' : ''}" data-col="${cols[i] ?? ''}">${t.texto}</td>`).join('')}
      <td class="num aporte-total${s.incompleto ? ' incompleto' : ''}"
          data-col="Total aportado">${s.totalTexto}</td>
      <td class="num diferencia" data-col="Diferencia"
          data-dif="${s.diferenciaTotalEstado}">${s.diferenciaTotalTexto}</td>
    </tr>`;

  const avisoReparto = s.participacionCuadra ? '' :
    `<p class="socios-nota alerta-reparto">Las participaciones no suman 100 %
      (suman ${s.participacionTotalTexto}). Mientras no cuadren, lo que le
      corresponde a cada uno está mal repartido en la hoja.</p>`;

  $('socios').innerHTML = `
    <p class="socios-intro">Lo que puso cada socio por la tierra. La última columna
      es la diferencia entre lo que aportó y lo que le corresponde por su
      participación: en verde puso de más, en rojo puso de menos, y en gris está exacto.</p>
    <div class="tabla-envoltura">
      <table class="tabla-socios">
        <thead>
          <tr>
            <th scope="col">Socio</th>
            <th scope="col">Participación</th>
            ${cols.map(c => `<th scope="col">${c}</th>`).join('')}
            <th scope="col">Total aportado</th>
            <th scope="col">Diferencia</th>
          </tr>
        </thead>
        <tbody>${filas}</tbody>
        <tfoot>${pie}</tfoot>
      </table>
    </div>
    ${avisoReparto}`;
}

/* --- la caja ----------------------------------------------------------- */

// La cuenta de la caja, de arriba abajo: el saldo con el que arranca, lo que
// entra y lo que sale, y la brecha con la que cierra.
//
// Todo el texto que sale de la hoja —el concepto de cada fila, el texto de una
// nota— llega ya escapado desde `construirVistaTablero`, y los avisos los arma
// `construirVistaCaja` mezclando literales con ese concepto ya escapado: por eso
// no se vuelven a escapar acá (hacerlo mostraría «&amp;lt;img» en pantalla). Lo
// único que se interpola dentro de un atributo es `tipo`, que sale del
// vocabulario cerrado de assets/js/paneles.js ('saldo', 'suma', 'resta',
// 'subtotal', 'brecha', 'otro') y nunca del texto de la hoja.
function pintarCaja(vista) {
  const c = construirVistaCaja(vista.caja);

  if (!c.hay) {
    $('caja').innerHTML =
      '<p class="invitacion">Todavía no hay una cuenta de caja que mostrar. Mirá los avisos del final.</p>';
    return;
  }

  const saldo = c.saldo ? `
    <div class="caja-saldo">
      <span class="rot">${c.saldo.concepto || 'Saldo'}</span>
      <strong>${c.saldo.valorTexto}</strong>
    </div>` : '';

  const movimientos = c.movimientos.length ? `
    <ul class="caja-lista">
      ${c.movimientos.map(m => `
        <li class="caja-fila" data-tipo="${m.tipo}"${m.contradice ? ' data-contradice' : ''}>
          <span class="caja-concepto">${m.concepto || '—'}</span>
          <span class="caja-valor">${m.valorTexto}</span>
        </li>`).join('')}
    </ul>` : '';

  // El número más importante del proyecto. Va en su propio bloque y no como una
  // fila más de la lista, y la línea de abajo dice qué significa el signo.
  const brecha = c.brecha ? `
    <div class="caja-brecha">
      <span class="rot">${c.brecha.concepto || 'Brecha'}</span>
      <strong>${c.brecha.valorTexto}</strong>
      ${c.brechaSentido ? `<span class="caja-brecha-nota">${c.brechaSentido}</span>` : ''}
    </div>` : '';

  const revisar = c.avisos.length
    ? `<ul class="caja-revisar">${c.avisos.map(a => `<li>${a}</li>`).join('')}</ul>`
    : '';

  const notas = c.notas.length ? `
    <dl class="caja-notas">
      ${c.notas.map(n => `
        <div><dt>${n.concepto || '—'}</dt><dd>${n.texto || '—'}</dd></div>`).join('')}
    </dl>` : '';

  $('caja').innerHTML = saldo + movimientos + brecha + revisar + notas;
}

/* --- el listado que abre una cifra ------------------------------------- */

// Una sola plantilla para los seis listados. Todo lo que entra acá salió de
// `construirDetalleCifra`, que trabaja sobre la vista YA escapada: por eso no
// se vuelve a escapar, igual que en el resto de los paneles. `numerica` y
// `alerta` son booleanos de aquel archivo, y los rótulos de las columnas son
// literales suyos — por eso pueden ir dentro de un atributo.
//
// El `data-rot` de cada celda es lo que la vuelve legible en el teléfono: ahí
// la tabla se desarma en bloques y cada dato lleva delante el nombre de su
// columna, porque cuatro columnas en 375 px no se leen.
function pintarDetalle(d) {
  const cabeza = d.columnas
    .map(c => `<th${c.numerica ? ' class="num"' : ''}>${c.etiqueta}</th>`).join('');

  const cuerpo = d.filas.map(f => `
    <tr${f.alerta ? ' data-alerta' : ''}>${f.celdas.map((celda, i) => {
      const col = d.columnas[i];
      return `<td${col?.numerica ? ' class="num"' : ''} data-rot="${col?.etiqueta ?? ''}">${celda}</td>`;
    }).join('')}</tr>`).join('');

  // Sin filas no se dibuja una tabla con el encabezado solo y un total en cero:
  // se dice qué pasa. Un $0 al pie de una tabla vacía afirma algo que no consta.
  const tabla = d.filas.length
    ? `<div class="detalle-tabla-caja">
         <table class="detalle-tabla">
           <thead><tr>${cabeza}</tr></thead>
           <tbody>${cuerpo}</tbody>
         </table>
       </div>`
    : `<p class="detalle-vacio">${d.vacio}</p>`;

  const pie = d.pie && d.filas.length
    ? `<p class="detalle-pie"><span>${d.pie.etiqueta}</span><strong>${d.pie.valor}</strong></p>`
    : '';

  const nota = d.nota ? `<p class="detalle-nota">${d.nota}</p>` : '';

  $('detalle-cifra').innerHTML =
    `<h2 class="detalle-titulo">${d.titulo}</h2>${tabla}${pie}${nota}`;
}

/* --- carga ------------------------------------------------------------- */

async function cargar(credencial) {
  let r;
  try {
    r = await fetch(API_TABLERO, { headers: { authorization: `Bearer ${credencial}` } });
  } catch {
    return mostrarError('No hay conexión con el servidor del tablero.');
  }
  let cuerpo;
  try {
    cuerpo = await r.json();
  } catch {
    // Cloudflare (u otra capa de borde) puede devolver una página de error
    // que no es JSON en cortes de infraestructura (502/522/523, un WAF).
    // Sin este try/catch esa excepción quedaba como unhandled rejection y
    // la pantalla de entrada se quedaba muda, sin ningún mensaje.
    return mostrarError('El servidor del tablero respondió con algo que no se pudo leer. Volvé a intentar en un momento.');
  }
  if (!r.ok) return mostrarError(cuerpo.error ?? 'No se pudo cargar el tablero.');

  const v = construirVistaTablero(cuerpo, new Date());
  $('entrada').hidden = true;
  $('contenido').hidden = false;
  $('frescura').textContent = v.frescura;

  if (v.alerta) { $('alerta').textContent = v.alerta; $('alerta').hidden = false; }

  // Las seis cifras de arriba. Cada una es un botón que abre, justo debajo, el
  // listado que la explica. Qué listado abre cada cual lo decide
  // `construirCifras` en assets/js/paneles.js, no este archivo.
  //
  // `c.etiqueta`, `c.texto` y `c.pista` se escapan igual: la etiqueta y la
  // cifra vienen de la hoja de Google. El índice es un número de este archivo.
  const cifras = construirCifras(v.resumen);
  $('resumen').innerHTML = cifras.map((c, i) => {
    const cuerpoCifra =
      `<span class="rot">${escapar(c.etiqueta)}</span><span class="val">${escapar(c.texto)}</span>`;
    // Sin listado detrás se queda como caja quieta. Un botón que no abre nada
    // es peor que un rótulo: promete algo que no cumple.
    return c.clave === null
      ? `<div class="cifra-caja">${cuerpoCifra}</div>`
      : `<button type="button" class="cifra-caja" data-cifra="${i}"
                 aria-expanded="false" aria-controls="detalle-cifra"
                 title="${escapar(c.pista)}">${cuerpoCifra}</button>`;
  }).join('');

  // `pintarMapa` revienta a propósito si el plano y data/lotes.json dejan de
  // hablar del mismo conjunto de lotes. Sin este try/catch esa excepción se
  // llevaba por delante los gastos y los avisos, que no tienen nada que ver.
  let avisosDelPlano = [];
  try {
    avisosDelPlano = await montarPlano(v);
  } catch (e) {
    $('mapa').innerHTML = '';
    // Sin plano no hay nada que filtrar ni que resumir: los botones y el
    // resumen se van con él, en vez de quedar mandando sobre un plano que ya no
    // está.
    $('filtros').innerHTML = '';
    $('totales').innerHTML = '';
    $('totales').hidden = true;
    $('ficha').innerHTML =
      '<p class="plano-error">No se pudo dibujar el plano de lotes. Las cifras y los gastos de abajo sí están al día.</p>';
    avisosDelPlano = [`No se pudo dibujar el plano de lotes: ${String(e.message ?? e)}`];
  }

  // El clic de una tarjeta abre debajo el listado que explica esa cifra. Vuelve
  // a pulsarse y se cierra. Solo uno abierto a la vez: son seis listas de la
  // misma pinta y dos abiertas juntas se leen como una sola.
  //
  // El inventario se pide una vez y se guarda: `construirDetalleCifra` lo
  // necesita para los lotes, y volver a bajarlo en cada clic sería pedirle a la
  // red lo que ya está en memoria.
  let inventario = null;
  let cifraAbierta = null;

  function cerrarDetalle() {
    cifraAbierta = null;
    $('detalle-cifra').hidden = true;
    $('detalle-cifra').innerHTML = '';
    for (const b of $('resumen').querySelectorAll('button.cifra-caja')) {
      b.setAttribute('aria-expanded', 'false');
    }
  }

  async function abrirDetalle(boton) {
    const i = Number(boton.dataset.cifra);
    if (cifraAbierta === i) { cerrarDetalle(); return; }

    if (inventario === null) inventario = await (await fetch('../data/lotes.json?v=85238aa1')).json();
    const d = construirDetalleCifra(cifras[i].clave, v, inventario);
    if (!d) return;

    cerrarDetalle();
    cifraAbierta = i;
    boton.setAttribute('aria-expanded', 'true');
    pintarDetalle(d);
    $('detalle-cifra').hidden = false;
  }

  for (const b of $('resumen').querySelectorAll('button.cifra-caja')) {
    b.addEventListener('click', () => {
      // Un fallo acá no puede llevarse el resto del tablero por delante: las
      // cifras, el plano y los gastos ya están en pantalla y siguen siendo
      // ciertos. Se cierra el cajón y se dice qué pasó, en el idioma de todos.
      abrirDetalle(b).catch((e) => {
        cerrarDetalle();
        $('detalle-cifra').hidden = false;
        $('detalle-cifra').innerHTML =
          `<p class="detalle-error">No se pudo armar este listado: ${escapar(String(e.message ?? e))}</p>`;
      });
    });
  }

  pintarGastos(v);
  pintarSocios(v);
  pintarCaja(v);

  // Los avisos del plano se muestran junto con los del Worker, en la misma
  // lista: los dos dicen «esto que ves puede estar mal, andá a revisar la
  // fuente». Los del Worker ya salieron escapados de `construirVistaTablero`;
  // los del plano los arma este archivo y por eso se escapan acá, sin
  // excepción, aunque hoy solo lleven números.
  const avisos = [...v.avisos, ...avisosDelPlano.map(escapar)];
  $('avisos').innerHTML = avisos.length
    ? '<h2>Revisar</h2><ul>' + avisos.map(a => `<li>${a}</li>`).join('') + '</ul>'
    : '';
}

window.onload = () => {
  // Si el script de accounts.google.com no cargó (sin conexión al momento
  // de abrir la página, red bloqueada, origen no autorizado), "google" no
  // existe: sin este chequeo era un ReferenceError silencioso y el botón
  // de entrar no aparecía nunca, sin ninguna explicación en pantalla.
  if (typeof google === 'undefined' || !google.accounts?.id) {
    return mostrarError('No se pudo cargar el inicio de sesión de Google. Revisá tu conexión a internet y recargá la página.');
  }
  google.accounts.id.initialize({
    client_id: GOOGLE_CLIENT_ID,
    callback: (r) => cargar(r.credential)
  });
  google.accounts.id.renderButton($('boton-google'), { theme: 'outline', size: 'large', locale: 'es' });
};
</script>

</body>
</html>
